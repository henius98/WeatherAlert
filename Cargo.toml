[package]
name = "weather-alert"
version = "0.1.0"
edition = "2021"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

# One test binary rooted at tests/suite/main.rs. Declared explicitly because a
# test crate root resolves `mod` against its own directory, so tests/suite.rs
# would look for tests/<name>.rs rather than tests/suite/<name>.rs.
[[test]]
name = "suite"
path = "tests/suite/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Worker glue is wasm-only so `cargo test` runs the domain logic natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# NOTE: `strip = true` breaks the build. wasm-bindgen needs the externref table
# for its catch wrappers (worker-build passes --force-enable-abort-handler) and
# stripping removes it: "externref table required for catch wrappers".
# `panic = "abort"` is likewise incompatible. wasm-opt -Oz in worker-build
# already handles size; we land at ~0.4 MB gzipped against a 3 MB ceiling.
